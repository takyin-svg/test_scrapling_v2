name: V3 Scrapling Test

on:
  workflow_dispatch: # 允許在 GitHub 網頁上手動點擊 "Run workflow" 執行

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 檢出程式碼
        uses: actions/checkout@v4
        
      - name: 🐍 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # 啟用快取，讓下次安裝套件更快
          
      - name: 📦 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          # 安裝你的 requirements.txt
          pip install -r requirements.txt
          
          # 🚨 關鍵防呆：Scrapling 的 DynamicSession 底層會用到 Playwright
          # 在 GitHub 乾淨的 Ubuntu 虛擬機裡，必須補上這行來安裝無頭瀏覽器與系統依賴
          python -m playwright install chromium --with-deps
          
      - name: 🚀 執行 V3 獨立測試
        run: python test_main.py
