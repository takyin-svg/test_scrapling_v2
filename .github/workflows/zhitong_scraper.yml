name: Zhitong Scraper
on:
  schedule:
    # 示例HKT時段，按你自己的主備cron修改
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          playwright install --with-deps chromium

      - name: Run zhitong crawler
        run: |
          python scripts/zhitong_crawler.py

      # 可按需加入：保存輸出json、飛書推送、緩存push_cache.json
      # - name: Save result
      #   run: cp output.json ./
