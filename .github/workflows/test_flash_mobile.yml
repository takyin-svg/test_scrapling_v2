name: Mobile 7x24 Flash Test

on:
  workflow_dispatch:

jobs:
  run-mobile-flash-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 檢出程式碼
        uses: actions/checkout@v4
        
      - name: 🐍 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: 📦 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: 🌐 安裝 Patchright 瀏覽器核心
        run: python -m patchright install
          
      - name: 🚀 執行手機版 7x24 快訊測試
        run: python test_flash_mobile.py
